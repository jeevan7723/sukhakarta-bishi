<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>सदस्य कर्ज खातावही व ३% व्याज व्यवस्थापन - सुखकर्ता बीशी</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1120;
      color: #f1f5f9;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .redirect-card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .brand-emblem-img {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 2px solid #f59e0b;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.45);
      background: #ffffff;
      padding: 2px;
      display: inline-block;
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }
  </style>
  <script>
    // Redirect to main application loans view with hash
    window.location.replace('index.html#loans');
  </script>
</head>
<body>
  <div class="redirect-card">
    <img src="assets/brand-logo-full.png" alt="सुखकर्ता बीशी" style="max-width: 250px; height: auto; border-radius: 12px; background: #ffffff; padding: 4px 8px; border: 2px solid #f59e0b; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35); margin-bottom: 1.25rem;">
    <h1>बीशी कर्ज व्यवस्थापन पेज लोड होत आहे...</h1>
    <p>कृपया थोडा वेळ थांबा, कर्ज खातावही व ३% व्याज पेजवर घेऊन जात आहोत.</p>
    <a href="index.html#loans" class="btn">थेट पेजवर जा ➔</a>
  </div>
</body>
</html>
